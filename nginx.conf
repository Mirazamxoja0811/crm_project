server {
    listen 80;
    server_name mirazamkhujacrm.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name mirazamkhujacrm.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/mirazamkhujacrm.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mirazamkhujacrm.duckdns.org/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # Asosiy sahifa va statik fayllar (CSS, JS, rasm) Nginx orqali beriladi
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # API so'rovlari FastAPI backendiga yo'naltiriladi
    location /api/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
